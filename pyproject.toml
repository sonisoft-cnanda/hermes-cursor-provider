[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hermes-cursor-provider"
version = "0.2.0"
description = "Hermes-controlled inference through Cursor CLI models"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Mazi"}]
keywords = ["hermes-agent", "cursor", "model-provider", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = ["jsonschema>=4.23,<5"]

[project.optional-dependencies]
test = ["openai>=1", "pytest>=8"]

[project.scripts]
hermes-cursor-provider = "hermes_cursor_provider.cli:main"

[project.urls]
Repository = "https://github.com/sonisoft-cnanda/hermes-cursor-provider"

[tool.hatch.build.targets.wheel]
packages = ["hermes_cursor_provider"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["FLY002"]
